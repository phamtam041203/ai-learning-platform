version: '3.8'

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: ai_learning_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_learning_db
      REDIS_URL: redis://redis:6379/0

volumes:
  postgres_data: